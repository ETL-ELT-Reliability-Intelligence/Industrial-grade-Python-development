# Local data platform: Kafka, PostgreSQL, S3-compatible storage, Airflow (webserver + scheduler), schema
# migrations, the quality bridge, the API/dashboard and web UIs for Kafka and PostgreSQL.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/airflow/Dockerfile
  image: etl-reliability-airflow:local
  environment:
    # Metadata in PostgreSQL (separate database), LocalExecutor: webserver and scheduler are separate processes.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://reliability:reliability@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: local-demo-secret-key # shared so the webserver can read task logs
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/pipelines/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/repo
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_BUCKET: raw-data
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    OLIST_DIR: /data/olist
    DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability # the warehouse, not Airflow's metadata DB
  volumes:
    - .:/opt/airflow/repo
    - ${OLIST_HOST_DIR:-./data/olist}:/data/olist:ro
    - airflow-logs:/opt/airflow/logs

services:
  kafka:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # PLAINTEXT (kafka:19092) is for containers, EXTERNAL (localhost:9092) for the host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
      POSTGRES_DB: reliability
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reliability -d reliability"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Was MinIO, but minio/minio is no longer pullable (see README).
  rustfs:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - rustfs-data:/data

  # Airflow keeps its own metadata in a separate database of the same server (not SQLite).
  airflow-db-init:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: reliability
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h postgres -U reliability -d reliability -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1
        || psql -h postgres -U reliability -d reliability -c "CREATE DATABASE airflow"

  # Web UIs for the demo: Kafka topics/messages, PostgreSQL tables. S3 has its own console on :9001 (rustfs).
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  adminer:
    image: adminer:4.8.1@sha256:34d37131366c5aa84e1693dbed48593ed6f95fb450b576c1a7a59d3a9c9e8802
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Applies the schema of the service tables (storage/postgres/migrations) and exits.
  migrate:
    image: etl-reliability-python:local
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    working_dir: /app
    command: python -m alembic -c storage/postgres/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
    volumes:
      - .:/app:ro

  # Stream processor: dataset.ingested / pipeline.* events -> batches, metrics, quality decisions in PostgreSQL (docs/stream_processor.md).
  stream-processor:
    image: etl-reliability-python:local
    working_dir: /app
    command: python -m services.stream_processor
    depends_on:
      migrate:
        condition: service_completed_successfully
      infrastructure-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: raw-data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - .:/app:ro

  # API + dashboard (http://localhost:8000) reading datasets, batches and quality decisions.
  backend:
    image: etl-reliability-python:local
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    working_dir: /app
    command: python -m uvicorn services.backend.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: raw-data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - .:/app:ro

  # One-shot: migrates Airflow's metadata database and creates the local admin user (admin/admin, demo only).
  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    command: >-
      bash -c "airflow db migrate
      && (airflow users create --username admin --password admin --firstname Admin --lastname User
      --role Admin --email admin@example.com || true)"
    restart: "no"

  # Web UI and CLI entry point (scripts run `docker compose exec airflow airflow ...`).
  airflow:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      infrastructure-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 5s
      timeout: 5s
      retries: 40

  infrastructure-init:
    image: etl-reliability-python:local
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    command: python -m scripts.init_infrastructure
    depends_on:
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: raw-data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

volumes:
  airflow-logs:
  postgres-data:
  rustfs-data:
