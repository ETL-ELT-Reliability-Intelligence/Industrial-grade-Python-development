# Local data platform: Kafka, PostgreSQL, S3-compatible storage, Airflow (webserver + scheduler), schema
# migrations, the quality bridge, the API/dashboard and web UIs for Kafka and PostgreSQL.
x-airflow-common: &airflow-common
  build: infra/airflow
  image: etl-reliability-airflow:local
  environment:
    # Metadata in PostgreSQL (separate database), LocalExecutor: webserver and scheduler are separate processes.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://reliability:reliability@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: local-demo-secret-key # shared so the webserver can read task logs
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/pipelines/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/repo
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    S3_ENDPOINT_URL: http://rustfs:9000
    S3_BUCKET: raw-data
    S3_ACCESS_KEY: minioadmin
    S3_SECRET_KEY: minioadmin
    OLIST_DIR: /data/olist
    DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability # the warehouse, not Airflow's metadata DB
  volumes:
    - .:/opt/airflow/repo
    - ./data/olist:/data/olist:ro
    - airflow-logs:/opt/airflow/logs

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # PLAINTEXT (kafka:19092) is for containers, EXTERNAL (localhost:9092) for the host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # set POSTGRES_PORT if a local PostgreSQL already uses 5432
    environment:
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
      POSTGRES_DB: reliability
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability -d reliability"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Was MinIO, but minio/minio is no longer pullable (see README).
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - rustfs-data:/data

  # Airflow keeps its own metadata in a separate database of the same server (not SQLite).
  airflow-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: reliability
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h postgres -U reliability -d reliability -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1
        || psql -h postgres -U reliability -d reliability -c "CREATE DATABASE airflow"

  # Web UIs for the demo: Kafka topics/messages, PostgreSQL tables. S3 has its own console on :9001 (rustfs).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  adminer:
    image: adminer:latest
    depends_on:
      - postgres
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Applies the schema of the service tables (storage/postgres/migrations) and exits.
  migrate:
    image: python:3.11-slim
    working_dir: /app
    command: >-
      sh -c "pip install -q 'alembic>=1.13,<2' 'SQLAlchemy>=2.0,<3' 'psycopg[binary]>=3.2,<4'
      && python -m alembic -c storage/postgres/alembic.ini upgrade head"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
    volumes:
      - .:/app:ro

  # Stream processor: dataset.ingested / pipeline.* events -> batches, metrics, quality decisions in PostgreSQL (docs/stream_processor.md).
  stream-processor:
    image: python:3.11-slim
    working_dir: /app
    command: >-
      sh -c "pip install -q 'pydantic>=2.9' 'confluent-kafka>=2.5' 'boto3>=1.34' 'psycopg[binary]>=3.2,<4'
      && python -m services.stream_processor"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      QUALITY_MAX_NULL_RATE: "0.5"  # Olist orders: undelivered ones have no delivery date
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: raw-data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - .:/app:ro

  # API + dashboard (http://localhost:8000) reading datasets, batches and quality decisions.
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: >-
      sh -c "pip install -q 'pydantic>=2.9' 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'psycopg[binary]>=3.2,<4'
      && python -m uvicorn services.backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://reliability:reliability@postgres:5432/reliability
    volumes:
      - .:/app:ro

  # One-shot: migrates Airflow's metadata database and creates the local admin user (admin/admin, demo only).
  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    command: >-
      bash -c "airflow db migrate
      && (airflow users create --username admin --password admin --firstname Admin --lastname User
      --role Admin --email admin@example.com || true)"
    restart: "no"

  # Web UI and CLI entry point (scripts run `docker compose exec airflow airflow ...`).
  airflow:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      rustfs:
        condition: service_started

volumes:
  airflow-logs:
  postgres-data:
  rustfs-data:
