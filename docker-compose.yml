# Local data-platform infrastructure. Airflow is added in a later step.
services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # PLAINTEXT (kafka:19092) is for containers, EXTERNAL (localhost:9092) for the host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
      POSTGRES_DB: reliability
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # S3-compatible object storage. Was MinIO, but minio/minio is no longer pullable (see README).
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - rustfs-data:/data

  airflow:
    image: apache/airflow:2.10.2-python3.11
    command: standalone
    depends_on:
      - kafka
      - rustfs
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /opt/airflow/repo
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/pipelines/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: raw-data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      _PIP_ADDITIONAL_REQUIREMENTS: pydantic>=2.9 confluent-kafka>=2.5 boto3>=1.34
    volumes:
      - .:/opt/airflow/repo

volumes:
  postgres-data:
  rustfs-data:
