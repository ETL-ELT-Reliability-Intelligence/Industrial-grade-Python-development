[project]
name = "etl-reliability-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
s3 = ["boto3>=1.34"]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.14,<1"]
browser = ["playwright>=1.50,<2"]
storage = ["alembic>=1.13,<2", "SQLAlchemy>=2.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Kafka broker (KAFKA_BOOTSTRAP_SERVERS)"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
