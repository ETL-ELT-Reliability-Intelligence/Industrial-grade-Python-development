[project]
name = "etl-reliability-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Kafka broker (KAFKA_BOOTSTRAP_SERVERS)"]
