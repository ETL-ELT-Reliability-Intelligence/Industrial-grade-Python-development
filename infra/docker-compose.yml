# Development infrastructure (development credentials only).
# Run from the repository root: docker compose -f infra/docker-compose.yml up -d --wait postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reliability
      POSTGRES_PASSWORD: reliability
      POSTGRES_DB: reliability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability -d reliability"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
