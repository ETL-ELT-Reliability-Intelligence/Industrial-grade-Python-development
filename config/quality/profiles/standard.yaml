checks:
  freshness:
    kind: freshness
    params:
      max_age_seconds: 3600
  schema:
    kind: schema
    on_missing_schema: WARN
  row_count:
    kind: row_count
    params:
      mode: historical
      history_window: 10
      min_history: 3
      min_ratio: 0.5
      max_ratio: 2.0
    on_insufficient_history: WARN
