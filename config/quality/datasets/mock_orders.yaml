dataset_id: mock_orders
version: 2
profile: standard
checks:
  amount.non_negative:
    kind: value_rule
    column: amount
    params:
      rule: non_negative
    on_fail: BLOCK
  amount.distribution:
    kind: distribution
    column: amount
    params:
      data_type: numeric
      bins:
      - 0
      - 5
      - 10
      - 25
      - 50
      - 100
      - 250
      - 500
      - 1000
      - 5000
    on_fail: WARN
  payment_method.distribution:
    kind: distribution
    column: payment_method
    params:
      data_type: categorical
    on_fail: WARN
  payment_method.cardinality:
    kind: cardinality
    column: payment_method
    params: {}
    on_fail: WARN
  amount.null_growth:
    kind: null_rate
    column: amount
    params:
      mode: historical
    on_fail: WARN
  payment_method.null_growth:
    kind: null_rate
    column: payment_method
    params:
      mode: historical
    on_fail: WARN
