version: 2

models:
  - name: fct_orders
    description: One row per order with item and payment totals.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: purchased_at
        tests: [not_null]
  - name: revenue
    description: Daily revenue of non-canceled orders.
    columns:
      - name: day
        tests: [unique, not_null]
